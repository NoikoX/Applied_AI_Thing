# Non-secret configuration. Model names live here only (see docs/DECISIONS.md).

llm:
  temperature: 0.0
  planner:
    provider: gemini
    name: gemini-3.5-flash-lite
  answer:
    provider: gemini
    name: gemini-3.5-flash-lite
  grader:  # separate model = separate free daily quota
    provider: gemini
    name: gemini-3.1-flash-lite
  fallback:
    provider: openai
    name: gpt-5-nano
  judge:  # evaluation only
    provider: openai
    name: gpt-5-mini

embeddings:
  provider: openai
  name: text-embedding-3-small
  dimensions: 1536

local_models:  # ONNX models run in-process via fastembed (no PyTorch)
  cache_dir: .cache/models  # relative to project root; filled at Docker build time
  threads: 1  # Render free has ~0.5 vCPU; more threads only add memory
  sparse: Qdrant/bm25
  reranker: Xenova/ms-marco-MiniLM-L-6-v2

dataset:
  hf_name: hotpotqa/hotpot_qa
  hf_config: distractor
  hf_revision: 1908d6afbbead072334abe2965f91bd2709910ab  # pinned dataset commit
  split: train
  n_questions: 3000
  seed: 42
  dev_fraction: 0.5
