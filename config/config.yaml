# Non-secret configuration. Model names live here only (see docs/DECISIONS.md).

llm:
  # temperature: 0 for repeatable answers; null = do not send it (GPT-5 models only accept
  # their default). reasoning_effort applies to OpenAI reasoning models only.
  planner: {provider: gemini, name: gemini-3.5-flash-lite, temperature: 0.0}
  answer: {provider: gemini, name: gemini-3.5-flash-lite, temperature: 0.0}
  grader: {provider: gemini, name: gemini-3.1-flash-lite, temperature: 0.0}  # own free quota
  # Fallback was gpt-5-nano until M11, where nano refused 21-27 of 43 golden questions
  # (7 should be refused); gpt-5-mini is the safety net now. Only used when Gemini fails.
  fallback: {provider: openai, name: gpt-5-mini, temperature: null, reasoning_effort: minimal}
  judge: {provider: openai, name: gpt-5-mini, temperature: null, reasoning_effort: low}  # eval only
  # Offline LLM comparison only: run the planner, answer and grader roles on one of these.
  comparison_generators:
    nano: {provider: openai, name: gpt-5-nano, temperature: null, reasoning_effort: minimal}
    mini: {provider: openai, name: gpt-5-mini, temperature: null, reasoning_effort: minimal}
  timeout_s: 60
  retry: {max_attempts: 4, backoff_base_s: 2.0, backoff_max_s: 30.0}
  cache_path: .cache/llm_responses.sqlite
  log_path: logs/llm_calls.jsonl
  # Free-tier limits per model [requests/minute, requests/day], read in AI Studio 2026-10-27.
  rate_limits:
    gemini-3.5-flash-lite: [15, 500]
    gemini-3.1-flash-lite: [15, 500]

embeddings:
  provider: openai
  # Production model. Chosen in M6: beat -small by ~10 points Full@5 on dev and test.
  name: text-embedding-3-large
  # Offline embedding comparison only: same vector size, so only the model differs.
  comparison_name: text-embedding-3-small
  dimensions: 1536
  batch_size: 256  # texts per API request
  max_retries: 5  # our retry policy (src/investigator/llm/retry.py); the SDK's own retries are off

index:
  chunking_strategy: paragraph  # collections are named chunks_<strategy> and docs_<strategy>
  near_duplicate_threshold: 0.95  # cosine similarity above which a new chunk is not indexed again

retrieval:  # every switch here is an evaluation configuration (see docs/DECISIONS.md D3-D5)
  mode: hybrid  # dense | sparse | hybrid
  fusion: weighted  # rrf | weighted. M6: weighted beat RRF on dev and test
  rrf_k: 60  # RRF constant: score = sum of 1 / (rrf_k + rank)
  dense_weight: 0.5  # weighted fusion only: alpha * dense + (1 - alpha) * bm25
  candidates_per_list: 50  # top hits taken from each search list
  rerank: true
  rerank_top_n: 30  # candidates passed to the cross-encoder
  selection: coverage  # topk | coverage
  final_k: 10  # chunks returned to the LLM
  coverage:  # weights to be tuned on the dev split only
    w_ce: 0.6  # cross-encoder relevance
    w_rrf: 0.4  # fused hybrid score
    w_cov: 0.3  # bonus for covering a sub-question not yet covered
    # Penalty x max cosine similarity to chunks already selected. Dev tuning (M6, no
    # sub-questions): 0.0 > 0.15 > 0.3, because the two gold paragraphs of a question are
    # often similar to each other. Revisit with the agent's sub-questions (M11).
    redundancy_lambda: 0.0
    max_chunks_per_doc: 2
    covers_top_n: 5  # a chunk "covers" a sub-question if it ranks this high for it
    min_score: 0.0  # stop selecting below this (feeds the insufficient-evidence check)

rag:
  # Refuse without asking the LLM if the best reranker score (0..1) is below this.
  # Starting value; to be tuned on dev / golden questions (M10-M11).
  min_relevance: 0.05

agent:
  max_hops: 2  # retrieval rounds; a bridge question needs 2 (find the entity, then its fact)
  max_queries_per_hop: 3
  max_sources: 10  # passages given to the answer step, merged from all hops

app:
  index_name: paragraph  # Qdrant collections the deployed app serves (chunks_<name>, docs_<name>)
  # Overrides of `retrieval` for the deployed app only; evaluation uses `retrieval` as is.
  # Render's free 512 MB instance ran out of memory with the reranker loaded (M12), so the
  # demo runs hybrid weighted fusion without it (M6's best non-reranked setting). Without
  # reranker scores the "relevance too low" pre-check is skipped; the LLM can still refuse.
  retrieval_overrides: {rerank: false, selection: topk}
  default_mode: agent  # agent | baseline
  max_upload_mb: 5
  limits:  # protect the free Gemini quota (an agent question uses ~4-7 LLM calls)
    ask_per_minute_per_client: 3
    ask_per_day_per_client: 30
    ask_per_day_total: 80
    uploads_per_day_per_client: 10

local_models:  # ONNX models run in-process via fastembed (no PyTorch)
  cache_dir: .cache/models  # relative to project root; filled at Docker build time
  threads: 1  # Render free has ~0.5 vCPU; more threads only add memory
  sparse: Qdrant/bm25
  reranker: Xenova/ms-marco-MiniLM-L-6-v2
  # Passages scored per model call. fastembed's default (64) put all 30 candidates in one
  # batch padded to the longest (up to 512 tokens): peak 1,073 MB, OOM on the 512 MB host.
  # Batch 4: 286 MB peak, same scores (each pair is scored independently).
  rerank_batch_size: 4

chunking:  # strategies compared in evaluation: paragraph (A) vs sentence_window (B)
  upload_strategy: recursive  # strategy C, for uploaded long documents
  sentence_window:
    window: 3  # sentences per chunk
    stride: 2  # step between window starts, so consecutive chunks share 1 sentence
  recursive:
    chunk_size: 1000  # characters, roughly 250 tokens
    chunk_overlap: 150

dataset:
  hf_name: hotpotqa/hotpot_qa
  hf_config: distractor
  hf_revision: 1908d6afbbead072334abe2965f91bd2709910ab  # pinned dataset commit
  split: train
  n_questions: 5000
  seed: 42
  dev_fraction: 0.5
