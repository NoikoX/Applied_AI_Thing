name: Keep-alive

# Qdrant Cloud pauses free clusters after 1 week without use. A daily deep
# health check makes a real Qdrant call through the deployed app.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call deep health check
        # Render's free tier can take ~1 minute to wake up, hence retries and a long timeout.
        run: >
          curl --fail --silent --show-error
          --retry 3 --retry-delay 30 --max-time 120
          "${{ vars.APP_URL }}/health/deep"
