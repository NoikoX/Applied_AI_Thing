[project]
name = "investigator"
version = "0.1.0"
description = "AI Investigation Engine: multi-hop RAG with hybrid search, citations and evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "gradio>=6.30.0",
    "langchain-text-splitters>=1.1.3",
    "psutil>=7.2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
data = [
    "datasets>=5.1.0",
]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
