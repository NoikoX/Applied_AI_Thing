# Retrieval configurations for scripts/run_retrieval_eval.py.
# Each entry: index (local collection base name, named after the model that built it),
# embedder ("production" = config embeddings.name, now text-embedding-3-large;
# "comparison" = embeddings.comparison_name, now text-embedding-3-small), and overrides
# of the `retrieval` section of config/config.yaml. Unlisted settings keep config values.
# The M6 stages/chunking/tuning grids ran with -small, before production switched to -large.

stages:  # chunking A + text-embedding-3-small: which retrieval stage helps?
  - {name: dense, index: paragraph__small, embedder: comparison, overrides: {mode: dense, rerank: false, selection: topk}}
  - {name: bm25, index: paragraph__small, embedder: comparison, overrides: {mode: sparse, rerank: false, selection: topk}}
  - {name: hybrid-rrf, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: false, selection: topk}}
  - {name: hybrid-weighted, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: weighted, rerank: false, selection: topk}}
  - {name: hybrid-rrf+rerank, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: topk}}
  - {name: hybrid-rrf+rerank+coverage, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: coverage}}

chunking:  # A (paragraph) vs B (sentence window), text-embedding-3-small, same retrieval settings
  - {name: A-dense, index: paragraph__small, embedder: comparison, overrides: {mode: dense, rerank: false, selection: topk}}
  - {name: B-dense, index: sentence_window__small, embedder: comparison, overrides: {mode: dense, rerank: false, selection: topk}}
  - {name: A-hybrid-rrf+rerank, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: topk}}
  - {name: B-hybrid-rrf+rerank, index: sentence_window__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: topk}}

embeddings:  # text-embedding-3-small vs text-embedding-3-large, both 1536 dims, chunking A
  - {name: small-dense, index: paragraph__small, embedder: comparison, overrides: {mode: dense, rerank: false, selection: topk}}
  - {name: large-dense, index: paragraph__large, embedder: production, overrides: {mode: dense, rerank: false, selection: topk}}
  - {name: small-hybrid-rrf, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: false, selection: topk}}
  - {name: large-hybrid-rrf, index: paragraph__large, embedder: production, overrides: {mode: hybrid, fusion: rrf, rerank: false, selection: topk}}
  - {name: small-hybrid-weighted, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: weighted, rerank: false, selection: topk}}
  - {name: large-hybrid-weighted, index: paragraph__large, embedder: production, overrides: {mode: hybrid, fusion: weighted, rerank: false, selection: topk}}

tuning:  # dev split only (text-embedding-3-small): weighted-fusion alpha and the redundancy penalty
  - {name: weighted-a0.3, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: weighted, dense_weight: 0.3, rerank: false, selection: topk}}
  - {name: weighted-a0.5, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: weighted, dense_weight: 0.5, rerank: false, selection: topk}}
  - {name: weighted-a0.7, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: weighted, dense_weight: 0.7, rerank: false, selection: topk}}
  - {name: weighted-a0.9, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: weighted, dense_weight: 0.9, rerank: false, selection: topk}}
  - {name: coverage-l0.0, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: coverage, coverage: {redundancy_lambda: 0.0}}}
  - {name: coverage-l0.15, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: coverage, coverage: {redundancy_lambda: 0.15}}}
  - {name: coverage-l0.3, index: paragraph__small, embedder: comparison, overrides: {mode: hybrid, fusion: rrf, rerank: true, selection: coverage, coverage: {redundancy_lambda: 0.3}}}
